name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test --release
        run: cargo test --release

  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Ariadne
        run: dotnet build Ariadne.csproj -c Release

      - name: Build and run domain tests
        run: dotnet test Ariadne.Tests/Ariadne.Tests.csproj -c Release
