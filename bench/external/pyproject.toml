[project]
name = "fdm-bench-external"
version = "0.1.0"
description = "External (jax_fdm) baselines for the inverse force-density benchmark"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jax-fdm==0.14.1",
    "numpy",
    "scipy",
]

[tool.uv]
package = false
# Matplotlib pulls Pillow. Versions before 13.0.0 keep a rejected GIF
# frame size after DecompressionBombError (CVE-2026-112400).
constraint-dependencies = ["pillow>=13.0.0"]
