[project]
name = "fdm-bench-figures"
version = "0.1.0"
description = "Figures for the inverse force-density warm-start write-up and talk"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.8",
    "numpy",
]

[tool.uv]
package = false
# Matplotlib pulls Pillow. Versions before 13.0.0 keep a rejected GIF
# frame size after DecompressionBombError (CVE-2026-112400).
constraint-dependencies = ["pillow>=13.0.0"]
