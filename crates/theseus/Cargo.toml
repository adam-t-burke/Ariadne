[package]
name = "theseus"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Force Density Method form-finding solver with hand-coded adjoints"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
faer-sparse = "0.17"
faer-core = "0.17"
faer-svd = "0.17"
dyn-stack = "0.10"
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.11"
basin = { version = "1.13", default-features = false }
nurbsbook = { path = "../nurbsbook" }
clarabel = "0.10"

[dev-dependencies]
# JSON case files of the external (JAX FDM / compas_cem) benchmark.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
